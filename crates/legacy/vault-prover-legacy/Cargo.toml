[package]
name = "vault-prover-legacy"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pre-fork (claim version 5) ProofCollection proving for Neptune Vault, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bincode = "1.3"
itertools = "0.14"
neptune-consensus = "0.15.0"
neptune-primitives = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
triton-vm = "7.0.0"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
wasm-bindgen = "0.2"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
neptune-consensus = { version = "0.15.0", features = ["test-helpers"] }
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-threads", "--enable-bulk-memory", "--enable-simd", "--enable-mutable-globals"]
