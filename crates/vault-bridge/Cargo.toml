[package]
name = "vault-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "The wallet core and prover as a native shell calls them, with no shell framework in sight"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
bincode = "1.3"
hex = "0.4"
neptune-consensus = "0.17.0"
neptune-primitives = "0.17.0"
neptune-rpc-api = "0.17.0"
num_cpus = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vault-core = { path = "../vault-core" }
vault-prover = { path = "../vault-prover" }
zeroize = "1"
