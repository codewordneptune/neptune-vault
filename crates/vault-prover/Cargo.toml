[package]
name = "vault-prover"
version = "0.1.0"
edition = "2021"
publish = false
description = "ProofCollection proving for Neptune Vault, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bincode = "1.3"
itertools = "0.14"
neptune-consensus = "0.17.0"
neptune-primitives = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
triton-vm = "8.0.0"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
# Both getrandom majors are in the dependency tree; each needs its browser backend.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
neptune-consensus = { version = "0.17.0", features = ["test-helpers"] }
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.wasm-pack.profile.release]
# wasm-opt on a prover this size takes many minutes; enable once the build is stable.
wasm-opt = false
