[package]
edition = "2024"
rust-version = "1.89"
name = "triton-vm"
version = "8.0.0"
authors = ["Triton Software AG"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A virtual machine that comes with Algebraic Execution Tables (AET) and Arithmetic Intermediate
Representations (AIR) for use in combination with a STARK proof system to allow proving correct
execution of arbitrary programs in zero-knowledge.
"""
homepage = "https://triton-vm.org/"
documentation = "https://triton-vm.org/spec/"
readme = "README.md"
keywords = [
    "zero-knowledge",
    "STARK",
    "virtual-machine",
    "recursive",
]
categories = [
    "cryptography",
    "mathematics",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TritonVM/triton-vm"
resolver = "2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O4",
    "--enable-bulk-memory",
]

[features]
# Neptune Vault: profiler compiled in (phase timings from the bench page).
# Dependents force `no_profile` on when it is a default feature, so it is
# removed from the defaults here.
default = []
no_profile = []

[lib]
name = "triton_vm"
crate-type = ["rlib"] # Neptune Vault: no cdylib (unhashed file name collides in native builds)
path = "src/lib.rs"

[[example]]
name = "factorial"
path = "examples/factorial.rs"

[[bench]]
name = "barycentric_eval"
path = "benches/barycentric_eval.rs"
harness = false

[[bench]]
name = "bezout_coeffs"
path = "benches/bezout_coeffs.rs"
harness = false

[[bench]]
name = "cached_vs_jit_trace"
path = "benches/cached_vs_jit_trace.rs"
harness = false

[[bench]]
name = "initialize_array"
path = "benches/initialize_array.rs"
harness = false

[[bench]]
name = "mem_io"
path = "benches/mem_io.rs"
harness = false

[[bench]]
name = "proof_size"
path = "benches/proof_size.rs"
harness = false

[[bench]]
name = "prove_fib"
path = "benches/prove_fib.rs"
harness = false

[[bench]]
name = "prove_halt"
path = "benches/prove_halt.rs"
harness = false

[[bench]]
name = "trace_mmr_new_peak_calculation"
path = "benches/trace_mmr_new_peak_calculation.rs"
harness = false

[[bench]]
name = "verify_halt"
path = "benches/verify_halt.rs"
harness = false

