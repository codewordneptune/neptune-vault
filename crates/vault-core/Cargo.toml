[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Wallet core for Neptune Vault (keys, addresses, scanning, witness building), compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
bincode = "1.3"
hex = "0.4"
itertools = "0.14"
neptune-consensus = "0.17.0"
neptune-mutator-set = "0.17.0"
neptune-primitives = "0.17.0"
neptune-rpc-api = "0.17.0"
neptune-wallet = "0.17.0"
num-traits = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-bip39 = "1.0"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
neptune-consensus = { version = "0.17.0", features = ["test-helpers"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-threads", "--enable-bulk-memory", "--enable-simd", "--enable-mutable-globals"]
