[package]
name = "vault-shell"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "The native shell for Neptune Vault: a window, and the commands that reach the bridge"

[lib]
# Desktop runs the binary; Android and iOS load this as a library, which is
# why the app is started from lib.rs rather than main.rs.
name = "vault_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# The native Save dialog, for backup files the page cannot write itself.
tauri-plugin-dialog = "2"
# Opening a link in the system's browser rather than inside the app.
tauri-plugin-opener = "2"
# A payment link (neptunecash:) clicked in another app or on a web page
# opens this one. 2.4 is the line that fits this Tauri; 2.5 needs Tauri 2.12.
tauri-plugin-deep-link = "~2.4.10"
vault-bridge = { path = "../../crates/vault-bridge" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# A second launch brings the first window forward instead of opening another
# on the same wallet; one started by a payment link hands the link over.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "android")'.dependencies]
# Reading the system bars' sizes from Android (app_insets), with the JNI
# crate version wry uses.
jni = "0.21"
