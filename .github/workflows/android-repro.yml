# Builds the Android app twice from one commit and compares the two unsigned
# APKs. F-Droid publishes an APK under the maintainer's signature only when
# its own build of the source matches that APK, byte for byte.
#
# Both builds run in the image F-Droid builds apps in, on separate runners,
# with no cache. One uses F-Droid's folder and user, the other a different
# folder and user, so anything tied to where a build ran shows up.
#
# Third-party actions are pinned to a commit and the image to a digest, so a
# moved tag cannot change what runs here (security audit H4).
name: Android reproducibility test

on:
  push:
    branches: [cwn/repro-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-repro-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: registry.gitlab.com/fdroid/fdroidserver@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac

jobs:
  build:
    name: Build ${{ matrix.build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: a
            user: vagrant
            dir: /home/vagrant/build/org.useneptune.vault
          - build: b
            user: builder
            dir: /srv/elsewhere/neptune-vault
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build in F-Droid's image
        env:
          BUILD_USER: ${{ matrix.user }}
          BUILD_DIR: ${{ matrix.dir }}
        run: |
          mkdir out
          docker run --rm \
            -e COMMIT="$GITHUB_SHA" -e BUILD_USER -e BUILD_DIR \
            -v "$PWD/shells/tauri/android-rebuild.sh:/rebuild.sh:ro" -v "$PWD/out:/out" \
            "$IMAGE" bash /rebuild.sh
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repro-${{ matrix.build }}
          path: out
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: builds

      - name: Same bytes?
        id: same
        run: |
          cat builds/repro-a/tools.txt
          a=builds/repro-a/app-unsigned.apk
          b=builds/repro-b/app-unsigned.apk
          sha256sum "$a" "$b"
          if cmp -s builds/repro-a/tools.txt builds/repro-b/tools.txt; then echo "Tools: same"; else echo "Tools: DIFFER"; fi
          if cmp -s builds/repro-a/web-dist.sha256 builds/repro-b/web-dist.sha256; then echo "Web build: same"; else echo "Web build: DIFFERS"; fi
          if cmp -s builds/repro-a/native.sha256 builds/repro-b/native.sha256; then echo "Native library: same"; else echo "Native library: DIFFERS"; fi
          if cmp -s "$a" "$b"; then
            echo "identical=true" >> "$GITHUB_OUTPUT"
            echo "Identical: $(sha256sum "$a" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "identical=false" >> "$GITHUB_OUTPUT"
          echo "The APKs differ. See the step log and the repro-differences artifact." >> "$GITHUB_STEP_SUMMARY"
          python3 - "$a" "$b" <<'EOF'
          import sys, zipfile
          a, b = [{i.filename: i for i in zipfile.ZipFile(p).infolist()} for p in sys.argv[1:3]]
          for name in sorted(a.keys() | b.keys()):
              x, y = a.get(name), b.get(name)
              if x is None or y is None:
                  print('only in one:', name)
              elif x.CRC != y.CRC:
                  print('differs:', name, x.file_size, y.file_size)
              elif (x.compress_size, x.header_offset, x.date_time) != (y.compress_size, y.header_offset, y.date_time):
                  print('same content, stored differently:', name)
          EOF

      - name: What differs
        if: steps.same.outputs.identical == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope-minimal binutils-multiarch
          timeout 30m diffoscope --text diffoscope.txt --html diffoscope.html --max-report-size 20000000 \
            builds/repro-a/app-unsigned.apk builds/repro-b/app-unsigned.apk || true
          ls -l diffoscope.*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.same.outputs.identical == 'false'
        with:
          name: repro-differences
          path: diffoscope.*
          if-no-files-found: warn
          retention-days: 14

      - name: Not identical
        if: steps.same.outputs.identical == 'false'
        run: exit 1
