# Builds the desktop apps from the Tauri shell (shells/tauri) for Windows,
# Linux and macOS, and attaches their installers to a draft GitHub release.
#
# Run it by pushing a tag named desktop-v<version> (for example
# desktop-v0.2.0), or by hand from the Actions tab, which builds without
# releasing and keeps the installers as workflow artifacts.
#
# Unsigned for now: code signing and the auto-updater need keys only the
# maintainer can create. docs/DESKTOP-RELEASE.md lists them and where they go.
#
# Third-party actions are pinned to a commit, not a tag, so a moved tag cannot
# change what runs here (security audit H4).
name: Release desktop apps

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: ''
          - label: Linux x64
            os: ubuntu-22.04
            args: ''
          - label: macOS Apple silicon
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The webview and the libraries a Tauri app links on Linux.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # rust-toolchain.toml pins the nightly; this installs it, and the extra
      # target a macOS job builds for.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show
          if [ -n "${{ matrix.rust_target }}" ]; then rustup target add ${{ matrix.rust_target }}; fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-${{ matrix.rust_target || matrix.os }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The page the shell loads; the Tauri CLI lives here too.
      - name: Web dependencies
        working-directory: web
        run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: shells/tauri
          tauriScript: npx --prefix ../../web tauri
          args: ${{ matrix.args }}
          # A tag makes a draft release, which a person reviews and publishes;
          # a run by hand only builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Neptune Vault desktop __VERSION__
          releaseBody: Unsigned test build. See docs/DESKTOP-RELEASE.md.
          releaseDraft: true
          prerelease: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neptune-vault-desktop-${{ matrix.rust_target || matrix.os }}
          path: |
            target/release/bundle/
            target/*/release/bundle/
          if-no-files-found: error
