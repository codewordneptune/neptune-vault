# Builds the desktop apps from the Tauri shell (shells/tauri) for Windows,
# Linux and macOS, and attaches their installers to a draft GitHub release.
#
# Run it by pushing a tag named desktop-v<version> (for example
# desktop-v0.2.0), or by hand from the Actions tab on a branch other than
# main, which builds without releasing and keeps the installers as workflow
# artifacts.
#
# The build jobs run the dependencies' build scripts, so they can only read
# the repository. The release is drafted by a job of its own, which runs none
# of the build's code (security audit R3).
#
# Unsigned for now: code signing and the auto-updater need keys only the
# maintainer can create. docs/DESKTOP-RELEASE.md lists them and where they go.
#
# Third-party actions are pinned to a commit, not a tag, so a moved tag cannot
# change what runs here (security audit H4).
name: Release desktop apps

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: ''
          - label: Linux x64
            os: ubuntu-22.04
            args: ''
          - label: macOS Apple silicon
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      # Never on main: runs on every branch and tag can restore what a run on
      # main saves in the Actions cache, so a compromised build there could
      # reach the others, releases included (security audit R1).
      - name: Not on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Start this workflow on a branch other than main, or push a desktop-v tag for a release."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The webview and the libraries a Tauri app links on Linux.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # rust-toolchain.toml pins the nightly; this installs it, and the extra
      # target a macOS job builds for.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show
          if [ -n "${{ matrix.rust_target }}" ]; then rustup target add ${{ matrix.rust_target }}; fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-${{ matrix.rust_target || matrix.os }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The apps offer a release by the version in its tag, so the tag must
      # name the version this commit builds.
      - name: Tag names the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./web/package.json').version")
          if [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not name the version in web/package.json, $version."
            exit 1
          fi

      # The page the shell loads; the Tauri CLI lives here too.
      - name: Web dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: shells/tauri
        run: npx --prefix ../../web tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neptune-vault-desktop-${{ matrix.rust_target || matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # The only job that can write. It works from the installers alone: no
  # checkout, and no build tool runs here.
  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: neptune-vault-desktop-*
          path: bundles

      # One folder of installers, named as GitHub shows them (a space becomes
      # a dot), so that SHA256SUMS checks the files as they are downloaded.
      - name: Installers and their checksums
        run: |
          set -euo pipefail
          mkdir release
          find bundles -type f -print0 | while IFS= read -r -d '' file; do
            name=$(basename "$file")
            name=${name// /.}
            if [ -e "release/$name" ]; then
              echo "::error::Two installers are named $name."
              exit 1
            fi
            mv "$file" "release/$name"
          done
          (cd release && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" release/
          cat release/SHA256SUMS

      # A signed record, kept by GitHub and in Sigstore's public log, that each
      # file came from this workflow at this commit (`gh attestation verify`).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      # Run again on the same tag, it adds to that tag's draft; a published
      # release it never changes.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$TAG is already published. Make a new version instead."
              exit 1
            fi
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --draft --prerelease --verify-tag \
              --title "Neptune Vault desktop ${TAG#desktop-v}" \
              --notes "Unsigned test build. See docs/DESKTOP-RELEASE.md, which also says how to check a download."
          fi
