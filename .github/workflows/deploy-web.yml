# Builds the wasm packages and the web app, then deploys to Azure Static Web
# Apps. Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_DEV from the
# Static Web App's deployment token (see docs/HOSTING.md).

name: Deploy web app

on:
  push:
    branches: [main]
    paths: ['web/**', 'crates/**', 'Cargo.*', '.cargo/**', 'rust-toolchain.toml', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # A named image and an exact Node, so that the same commit builds the
    # same files next month as today.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the nightly and pulls rust-src and the wasm32
      # target; the threaded build rebuilds std, so both are required.
      - name: Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/legacy/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: wasm-${{ runner.os }}-

      # The wallet core's own tests, which the web tests cannot stand in
      # for: key derivation, scanning, the chain checks held against real
      # mainnet blocks, and sending. Then the test that guards the one change
      # made to vendored arithmetic, the field inverse in twenty-first,
      # whose debug assertion is compiled out of release builds.
      - name: Rust tests
        run: |
          cargo test --locked -p vault-core
          cargo test --locked --manifest-path crates/vendor/twenty-first/Cargo.toml norm_based_inverse

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build wasm packages
        working-directory: web
        run: |
          npm run wasm:core
          npm run wasm:prover
          npm run wasm:prover-legacy

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install, test, build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      # What this run deploys, file by file. Anyone can build the same commit
      # and compare, or hash what the site serves and compare. The list is in
      # the run's summary and kept as an artifact.
      - name: Hashes of the deployed files
        working-directory: web/dist
        run: |
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../dist.sha256
          {
            echo "### Deployed files, commit ${GITHUB_SHA}"
            echo
            echo "$(wc -l < ../dist.sha256) files. SHA-256 of the list itself: $(sha256sum ../dist.sha256 | cut -d' ' -f1)"
            echo
            echo '<details><summary>Every file</summary>'
            echo '<pre>'
            cat ../dist.sha256
            echo '</pre>'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sha256-${{ github.sha }}
          path: web/dist.sha256
          retention-days: 90

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: upload
          app_location: web/dist
          skip_app_build: true
