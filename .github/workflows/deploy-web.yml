# Builds the wasm packages and the web app, then deploys to Azure Static Web
# Apps. The build runs the dependencies' code, so it holds no secret. The
# deploy is a job of its own that only uploads what the build made, and only
# after the maintainer approves it in the `prod` environment, the one
# place the deployment token is kept (docs/HOSTING.md, security audit H4).
#
# The Rust tests and the two wasm packages build side by side, each on a
# runner of its own. The web app is built once both packages are done, from
# files checked against the hashes their jobs reported.
#
# Third-party actions are pinned to a commit, not a tag, so a moved tag cannot
# change what runs here.

name: Deploy web app

on:
  push:
    branches: [main]
    paths: ['web/**', 'crates/**', 'Cargo.*', '.cargo/**', 'rust-toolchain.toml', '.github/workflows/deploy-web.yml', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces one of the same branch still building or waiting for
# approval; a run by hand on another branch leaves main's alone.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on a named image, with an exact Node where it needs one, so
# that the same commit builds the same files next month as today. Nothing
# comes from the Actions cache, for cargo or npm: any other run on main can
# save an entry there, and this build would ship what it holds (security
# audit R1).
jobs:
  # The wallet core's own tests, which the web tests cannot stand in for:
  # key derivation, scanning, the chain checks held against real mainnet
  # blocks, and sending. The deploy waits for them.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the nightly and pulls rust-src and the wasm32
      # target; the threaded build rebuilds std, so both are required.
      - name: Rust toolchain
        run: rustup show

      - name: Rust tests
        run: cargo test --locked -p vault-core

  # The two wasm packages, each on a runner of its own: they share no
  # compiled code, since each builds Triton VM with other features. Each
  # reports one SHA-256, of the list of its files' hashes, which the web
  # job checks before it uses them.
  wasm-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.hashes.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show

      - uses: ./.github/actions/wasm-tools

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0

      - name: Build
        working-directory: web
        run: npm run wasm:core

      - name: Hashes
        id: hashes
        working-directory: web/public/wasm/core
        run: |
          set -euo pipefail
          hash=$(find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-core
          path: web/public/wasm/core
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  wasm-prover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.hashes.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show

      - uses: ./.github/actions/wasm-tools

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0

      - name: Build
        working-directory: web
        run: npm run wasm:prover

      - name: Hashes
        id: hashes
        working-directory: web/public/wasm/prover
        run: |
          set -euo pipefail
          hash=$(find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-prover
          path: web/public/wasm/prover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The web app, from the two packages: every file checked against the hash
  # its job reported, then installed, tested and built.
  web:
    needs: [wasm-core, wasm-prover]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The build's licence notices list the crates through cargo.
      - name: Rust toolchain
        run: rustup show

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-core
          path: web/public/wasm/core

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-prover
          path: web/public/wasm/prover

      - name: The packages their jobs built, and no others
        env:
          CORE: ${{ needs.wasm-core.outputs.sha256 }}
          PROVER: ${{ needs.wasm-prover.outputs.sha256 }}
        run: |
          set -euo pipefail
          listed() { (cd "web/public/wasm/$1" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1); }
          test -n "$CORE"
          test -n "$PROVER"
          test "$(listed core)" = "$CORE"
          test "$(listed prover)" = "$PROVER"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0

      - name: Install, test, build
        working-directory: web
        run: |
          # No install scripts: a dependency must not get to run code here just by
          # being installed. Nothing this app uses needs one (checked with a clean
          # install, the tests and a build).
          npm ci --ignore-scripts
          npm test
          npm run build

      # What this run deploys, file by file. Anyone can build the same commit
      # and compare, or hash what the site serves and compare. The list is in
      # the run's summary and kept as an artifact.
      - name: Hashes of the deployed files
        working-directory: web/dist
        run: |
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../dist.sha256
          {
            echo "### Deployed files, commit ${GITHUB_SHA}"
            echo
            echo "$(wc -l < ../dist.sha256) files. SHA-256 of the list itself: $(sha256sum ../dist.sha256 | cut -d' ' -f1)"
            echo
            echo '<details><summary>Every file</summary>'
            echo '<pre>'
            cat ../dist.sha256
            echo '</pre>'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-sha256-${{ github.sha }}
          path: web/dist.sha256
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: web/dist
          include-hidden-files: true
          retention-days: 14

  # Only main's build goes out, once its Rust tests have passed and the
  # maintainer approves it: the job waits in the prod environment, which
  # only main may use and which alone holds the token. No checkout, and no
  # build tool runs here.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [tests, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: prod
      url: https://vault.dev.useneptune.org
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: web/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-sha256-${{ github.sha }}
          path: web

      - name: The files the build listed, and no others
        working-directory: web/dist
        run: |
          sha256sum --check --strict --quiet ../dist.sha256
          test "$(find . -type f | wc -l)" -eq "$(wc -l < ../dist.sha256)"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: upload
          app_location: web/dist
          skip_app_build: true
